name: Build Stick Clash Arena V11 Release APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract game
        run: unzip -o StickClashArena_V11_Source.zip

      - name: Configure Android SDK
        shell: bash
        run: |
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Restore release signing key
        env:
          SCA_KEYSTORE_B64: ${{ secrets.SCA_KEYSTORE_B64 }}
        run: |
          if [ -z "$SCA_KEYSTORE_B64" ]; then
            echo "SCA_KEYSTORE_B64 secret is missing"
            exit 1
          fi

          echo "$SCA_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/stickclash-release.jks"
          echo "SCA_KEYSTORE_PATH=$RUNNER_TEMP/stickclash-release.jks" >> "$GITHUB_ENV"

      - name: Build signed Release APK
        env:
          SCA_KEYSTORE_PASSWORD: ${{ secrets.SCA_KEYSTORE_PASSWORD }}
          SCA_KEY_ALIAS: ${{ secrets.SCA_KEY_ALIAS }}
          SCA_KEY_PASSWORD: ${{ secrets.SCA_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Verify APK signature
        run: |
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify \
            --verbose \
            app/build/outputs/apk/release/app-release.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: StickClashArena-V11-RELEASE
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error